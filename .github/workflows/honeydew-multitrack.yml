name: Honeydew multi-track MIDI tests

on:
  push:
    branches: [honeydew-multitrack]
  pull_request:
    branches: [main]

jobs:
  codec-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install codec test dependencies
        run: python -m pip install --upgrade pip pretty_midi numpy
      - name: Run codec smoke tests
        working-directory: src
        run: python -m unittest discover -s tests -v
